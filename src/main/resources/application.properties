spring.application.name=secure
server.port=8081
# Cache configuration
app.cache.ttl=1m

# Swagger / OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

#http://localhost:8081/swagger-ui.html
#http://localhost:8081/v3/api-docs

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/secureDB
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.root=INFO
logging.level.com.secureworld.secure=INFO

# JWT secret must be replaced through JWT_SECRET in every deployed environment.
jwt.secret=${JWT_SECRET:bXktZGV2LXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyeS1sb25n}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Weather API configuration. Set WEATHER_API_KEY in each deployed environment.
weather.api.base-url=${WEATHER_API_BASE_URL:https://api.openweathermap.org/data/2.5}
weather.api.api-key=${WEATHER_API_KEY:}
weather.api.connect-timeout-ms=${WEATHER_API_CONNECT_TIMEOUT_MS:3000}
weather.api.read-timeout-ms=${WEATHER_API_READ_TIMEOUT_MS:5000}
